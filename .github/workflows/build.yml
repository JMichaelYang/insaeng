name: build

on:
  pull_request:
    branches: [develop, release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check generated design tokens are up to date
        run: pnpm --filter @insaeng/design-system tokens:check
      - run: pnpm --filter @insaeng/design-system typecheck
      - run: pnpm build
